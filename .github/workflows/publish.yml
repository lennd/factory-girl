name: Publish to GitHub Packages

# Publishes @lennd/sessionboard-factory-girl to GitHub Packages
# (npm.pkg.github.com) with the workflow's GITHUB_TOKEN, so no npm token
# is needed or can expire.
#
# - push to master: publishes the version in package.json if it is not
#   already in the registry. Bump "version" (and rebuild dist/) in your PR to release.
# - Manual run: publishes the version at any commit (used to backfill
#   older versions).

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to publish (default: master)'
        required: false
        default: 'master'

concurrency:
  group: publish-${{ github.workflow }}-${{ github.event.inputs.ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lennd'

      # GitHub Packages requires the npm scope to match the GitHub org, so
      # the package is published as @lennd/<name>. Consumers keep importing
      # @sessionboard/<name> through an npm alias in their package.json.
      # Older commits predate these package.json fields, so set them here.
      - name: Point package at GitHub Packages
        run: |
          npm pkg set name=@lennd/$(node -p "require('./package.json').name.split('/').pop()")
          npm pkg set publishConfig.registry=https://npm.pkg.github.com
          npm pkg set repository.type=git
          npm pkg set repository.url=git+https://github.com/${{ github.repository }}.git

      - name: Publish if this version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # npm view exits 0 with empty output when the version is missing,
          # so test the output, not the exit code.
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null)" ]; then
            echo "$NAME@$VERSION is already published; nothing to do."
            exit 0
          fi
          npm publish --ignore-scripts
          echo "Published $NAME@$VERSION to GitHub Packages."
